<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bertani Sederhana</title>
    <!-- Menghubungkan file style.css secara terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Header Game -->
        <header class="game-header" style="text-align: center; margin-bottom: 12px;">
            <h2 style="margin: 0; font-size: 22px; color: #2e7d32; display: flex; align-items: center; justify-content: center; gap: 8px;">🌾 Game Bertani</h2>
        </header>

        <!-- Panel Nickname & Saldo -->
        <div class="player-panel">
            <div class="player-info-row">
                <div>
                    <span style="font-size: 11px; opacity: 0.9; display: block;">PENGELOLA LAHAN</span>
                    <h3 id="player-nickname" style="cursor: pointer;" onclick="bukaModalNickname()" title="Klik untuk ubah nickname">👨‍🌾 Petani Pintar ✏️</h3>
                </div>
                <div style="text-align: right;">
                    <span style="font-size: 11px; opacity: 0.9; display: block;">SALDO KAS</span>
                    <strong id="player-koin" style="font-size: 18px; color: #ffeb3b;">Rp 3.500</strong>
                </div>
            </div>
            
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 10px 0;">
            
            <div class="player-info-row" style="margin-bottom: 0;">
                <span style="font-size: 11px; opacity: 0.8;">💾 Data otomatis tersimpan</span>
                <div class="save-load-btns">
                    <button class="btn-action-small" onclick="simpanGame()">Simpan</button>
                    <button class="btn-action-small" onclick="resetGame()" style="background: rgba(211, 47, 47, 0.5);">Reset</button>
                </div>
            </div>
        </div>

        <!-- Navigasi Tab Game -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="openGameTab('menanam')">🌽 Menanam</button>
            <button class="tab-btn" onclick="openGameTab('inventory')">🎒 Inventory</button>
            <button class="tab-btn" onclick="openGameTab('pasar')">🛒 Pasar</button>
        </div>

        <!-- Konten Tab: Menanam -->
        <div id="tab-menanam" class="tab-content active">
            <h3>Lahan Pertanian</h3>
            <div id="lahan-container" class="farm-grid"></div>
        </div>

        <!-- Konten Tab: Inventory -->
        <div id="tab-inventory" class="tab-content">
            <h3>Inventory Saya</h3>
            <div id="inventory-list" class="inventory-container"></div>
        </div>

        <!-- Konten Tab: Pasar -->
        <div id="tab-pasar" class="tab-content">
            <h3>Pasar Bibit & Pupuk</h3>
            <div id="pasar-container" class="market-container"></div>

            <button id="btn-tambah-lahan" class="btn-submit" style="margin-top: 20px; background-color: #2e7d32; width: 100%; display: none;" onclick="beliLahan()">➕ Beli Lahan Baru</button>
        </div>
    </div>

    <!-- Modal Transaksi Beli/Jual dengan Tombol Bertingkat -->
    <div id="transaction-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="width: 320px; text-align: center;">
            <h3 id="modal-title" style="margin-bottom: 5px;">Transaksi</h3>
            <p id="modal-price" style="margin: 5px 0 15px 0; color: #555; font-size: 13px;"></p>
            
            <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
                <!-- Tombol Pengurang Bertingkat (-10, -5, -1) -->
                <div style="display: flex; justify-content: center; gap: 5px;">
                    <button onclick="ubahQty(-10)" style="flex: 1; padding: 6px; font-size: 11px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">-10</button>
                    <button onclick="ubahQty(-5)" style="flex: 1; padding: 6px; font-size: 11px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">-5</button>
                    <button onclick="ubahQty(-1)" style="flex: 1; padding: 6px; font-size: 11px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">-1</button>
                </div>

                <!-- Display Angka Jumlah Qty -->
                <div style="background: #f5f5f5; padding: 8px; border-radius: 6px; font-size: 20px; font-weight: bold; color: #2e7d32;" id="modal-qty-display">1</div>

                <!-- Tombol Penambah Bertingkat (+1, +5, +10) & Maks -->
                <div style="display: flex; justify-content: center; gap: 5px;">
                    <button onclick="ubahQty(1)" style="flex: 1; padding: 6px; font-size: 11px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">+1</button>
                    <button onclick="ubahQty(5)" style="flex: 1; padding: 6px; font-size: 11px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">+5</button>
                    <button onclick="ubahQty(10)" style="flex: 1; padding: 6px; font-size: 11px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">+10</button>
                    <button onclick="setQtyMaks()" style="flex: 1.2; padding: 6px; font-size: 11px; background: #43a047; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Maks</button>
                </div>
            </div>

            <p style="margin-bottom: 15px; font-size: 14px;">Total: <strong id="modal-total-price" style="color: #2e7d32; font-size: 16px;">Rp 0</strong></p>

            <div style="display: flex; gap: 10px;">
                <button id="btn-confirm-transaction" onclick="konfirmasiTransaksi()" style="flex: 1; background-color: #2e7d32; padding: 10px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Konfirmasi</button>
                <button onclick="tutupModalTransaksi()" style="flex: 1; background-color: #d32f2f; padding: 10px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal Ubah Nickname -->
    <div id="nickname-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="text-align: center;">
            <h3>Ubah Nama Petani</h3>
            <p style="margin: 10px 0; font-size: 13px; color: #555;">Masukkan nama panggilan baru untuk profilmu:</p>
            <input type="text" id="input-new-nickname" placeholder="Nama Petani..." style="width: 80%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 15px; text-align: center;">
            <div style="display: flex; gap: 10px;">
                <button class="btn-submit" onclick="simpanNicknameBaru()" style="flex: 1; background-color: #2e7d32;">Simpan</button>
                <button class="btn-submit" onclick="tutupModalNickname()" style="flex: 1; background-color: #d32f2f;">Batal</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-overlay" class="toast-overlay" style="display: none;">
        <div id="toast-card" class="toast-card">
            <span id="toast-icon">✓</span>
            <span id="toast-message">Pesan Berhasil</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
