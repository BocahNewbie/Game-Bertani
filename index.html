<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bertani Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Header / Status Bar -->
        <header class="game-header">
            <h2>🌾 Game Bertani</h2>
            <div class="status-bar">
                <span>💰 Uang: <strong id="player-koin">2.500</strong></span>
            </div>
        </header>

        <!-- Navigasi Tab -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="openGameTab('menanam')">🌽 Menanam</button>
            <button class="tab-btn" onclick="openGameTab('inventory')">🎒 Inventory</button>
            <button class="tab-btn" onclick="openGameTab('pasar')">🛒 Pasar</button>
        </div>

        <!-- Konten Tab: Menanam -->
        <div id="tab-menanam" class="tab-content active">
            <h3>Lahan Pertanian</h3>
            <div id="lahan-container" class="farm-grid">
                <!-- Lahan akan dirender lewat script.js -->
            </div>
        </div>

        <!-- Konten Tab: Inventory -->
        <div id="tab-inventory" class="tab-content">
            <h3>Inventory Saya</h3>
            <div id="inventory-list" class="inventory-container">
                <!-- Inventory akan dirender lewat script.js -->
            </div>
        </div>

        <!-- Konten Tab: Pasar (Tombol Beli Lahan dipindah ke sini) -->
        <div id="tab-pasar" class="tab-content">
            <h3>Pasar Bibit & Pupuk</h3>
            <div id="pasar-container" class="market-container">
                <!-- Pasar akan dirender lewat script.js -->
            </div>

            <!-- Tombol Beli Lahan Baru -->
            <button id="btn-tambah-lahan" class="btn-submit" style="margin-top: 20px; background-color: #2e7d32; width: 100%; display: none;" onclick="beliLahan()">➕ Beli Lahan Baru</button>
        </div>
    </div>

    <!-- Modal Transaksi (Beli / Jual) -->
    <div id="transaction-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="modal-title">Transaksi</h3>
            <p id="modal-price" style="margin: 10px 0; color: #555;"></p>
            
            <div class="modal-qty-control" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0;">
                <button onclick="ubahQty(-1)" class="btn-qty">-</button>
                <span id="modal-qty-display" style="font-size: 18px; font-weight: bold; min-width: 30px; text-align: center;">1</span>
                <button onclick="ubahQty(1)" class="btn-qty">+</button>
                <button onclick="setQtyMaks()" class="btn-qty" style="padding: 5px 10px; font-size: 12px;">Maks</button>
            </div>

            <p style="margin-bottom: 15px;">Total: <strong id="modal-total-price" style="color: #2e7d32;">Rp 0</strong></p>

            <div style="display: flex; gap: 10px;">
                <button id="btn-confirm-transaction" class="btn-submit" onclick="konfirmasiTransaksi()" style="flex: 1; background-color: #2e7d32;">Konfirmasi</button>
                <button class="btn-submit" onclick="tutupModalTransaksi()" style="flex: 1; background-color: #d32f2f;">Batal</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-overlay" class="toast-overlay" style="display: none;">
        <div id="toast-card" class="toast-card">
            <span id="toast-icon">✓</span>
            <span id="toast-message">Pesan Berhasil</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
