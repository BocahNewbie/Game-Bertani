<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bertani & Peternakan Modular</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Header / Informasi Pemain -->
        <header>
            <h1>Desa Makmur Game</h1>
            <div id="stats-bar">
                <span>Uang: <strong id="player-money">1000</strong> Koin</span>
                <span>Hari: <strong id="game-day">1</strong></span>
                <span>Waktu: <strong id="game-time">06:00</strong></span>
                <span>Cuaca: <strong id="game-cuaca">Cerah</strong></span>
            </div>
        </header>

        <!-- Area Navigasi Toko / Lokasi -->
        <nav id="location-nav">
            <button onclick="bukaModal('supermarket')">Supermarket (Bibit)</button>
            <button onclick="bukaModal('pasar')">Pasar (Hewan & Pakan)</button>
            <button onclick="bukaModal('pengepul')">Pengepul (Jual Hasil)</button>
            <button onclick="bukaInventory()">Inventory</button>
        </nav>

        <!-- Area Utama Permainan -->
        <main>
            <!-- Lahan Pertanian -->
            <section id="farm-section">
                <h2>Lahan Pertanian</h2>
                <div id="lahan-grid" class="grid-container">
                    <!-- Petak lahan akan dirender otomatis via JavaScript -->
                </div>
            </section>

            <!-- Peternakan -->
            <section id="farm-animal-section">
                <h2>Peternakan Hewan</h2>
                <div id="kandang-container">
                    <!-- Kandang & hewan akan dirender otomatis via JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <!-- Script JavaScript modular -->
    <script src="database.js"></script>
    <script src="harga.js"></script>
    <script src="cuaca.js"></script>
    <script src="inventory.js"></script>
    <script src="market.js"></script>
    <script src="pasar.js"></script>
    <script src="pertanian.js"></script>
    <script src="peternakan.js"></script>
    <script src="script.js"></script>
</body>
</html>
