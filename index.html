<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Bertani</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="game-header">
      <div class="player-info">
        <h3>👨‍🌾 Petani</h3>
      </div>
      <div class="gold-display">💰 Rp <span id="player-koin">2.500</span></div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="openGameTab('menanam')">Lahan</button>
      <button class="tab-btn" onclick="openGameTab('pasar')">Pasar</button>
      <button class="tab-btn" onclick="openGameTab('inventory')">Inventory</button>
    </div>

    <!-- TAB LAHAN -->
    <div id="tab-menanam" class="tab-content active">
      <h4>Lahan Pertanian Saya</h4>
      <div class="farm-land" id="lahan-1">
        <p id="status-lahan">Lahan Kosong</p>
        <button id="btn-tanam" class="btn-submit" style="width: auto; margin-top: 10px; display: none;" onclick="tanamTanaman()">Tanam Bibit</button>
        <button id="btn-panen" class="btn-submit" style="width: auto; margin-top: 10px; display: none; background-color: #f57f17;" onclick="panenTanaman()">Panen Hasil</button>
      </div>
    </div>

    <!-- TAB PASAR -->
    <div id="tab-pasar" class="tab-content">
      <h4>Toko Bibit</h4>
      <br>
      <div class="card-item">
        <div>
          <strong>🌱 Bibit Semangka</strong><br>
          <small>Harga Beli: Rp 800 | Waktu: 30 Detik</small>
        </div>
        <button class="btn-buy" onclick="bukaModalBeli('Bibit Semangka', 800)">Beli</button>
      </div>

      <div class="card-item">
        <div>
          <strong>🌱 Bibit Melon</strong><br>
          <small>Harga Beli: Rp 500 | Waktu: 15 Detik</small>
        </div>
        <button class="btn-buy" onclick="bukaModalBeli('Bibit Melon', 500)">Beli</button>
      </div>
    </div>

    <!-- TAB INVENTORY -->
    <div id="tab-inventory" class="tab-content">
      <h4>Inventory Saya</h4>
      <p style="font-size: 11px; color: #666; margin-top: 4px;">Harga pasar berubah setiap jam.</p>
      <br>
      <div id="inventory-list">
        <p style="color: #777; font-style: italic;">Inventory masih kosong.</p>
      </div>
    </div>
  </div>

  <!-- MODAL PEMBELIAN MODERN -->
  <div id="buy-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 id="modal-title">Beli Bibit</h3>
      <p id="modal-price" style="font-size: 13px; color: #666; margin: 4px 0 16px 0;"></p>
      
      <div class="modal-input-group">
        <label for="modal-qty">Jumlah (1 - 99 pcs):</label>
        <input type="number" id="modal-qty" min="1" max="99" value="1" oninput="hitungTotalModal()">
      </div>

      <div class="modal-total-preview">
        Total: <strong id="modal-total-price">Rp 0</strong>
      </div>

      <div class="modal-buttons">
        <button class="btn-cancel" onclick="tutupModalBeli()">Batal</button>
        <button class="btn-confirm" onclick="konfirmasiBeli()">Konfirmasi Beli</button>
      </div>
    </div>
  </div>

  <!-- MODERN NOTIFICATION POPUP (AUTO-CLOSE 2 DETIK) -->
  <div id="toast-overlay" class="toast-overlay">
    <div id="toast-card" class="toast-card">
      <div id="toast-icon" class="toast-icon"></div>
      <div id="toast-message" class="toast-message">Pesan notifikasi</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
