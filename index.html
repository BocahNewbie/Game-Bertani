<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Bertani</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #eef5ed;
      color: #2d4030;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #d2e3d0;
    }

    /* Tab Navigation */
    .nav-tabs {
      display: flex;
      background-color: #2e7d32;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border: none;
      background: transparent;
      color: #c8e6c9;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .tab-btn.active {
      background-color: #ffffff;
      color: #2e7d32;
    }

    .tab-content {
      display: none;
      padding: 24px;
    }

    .tab-content.active {
      display: block;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: #1b5e20;
    }

    .alert {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 14px;
      display: none;
    }

    .alert-error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .alert-success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    /* Game Dashboard Styles */
    .game-header {
      background-color: #e8f5e9;
      padding: 16px 24px;
      border-bottom: 1px solid #c8e6c9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-info h3 {
      font-size: 18px;
      color: #1b5e20;
    }

    .gold-display {
      font-weight: bold;
      color: #f57f17;
      background: #fffde7;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #fff59d;
    }

    .farm-land {
      background: #8d6e63;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: white;
      margin-top: 10px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card-item {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-buy {
      background-color: #ef6c00;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-buy:hover {
      background-color: #e65100;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- AUTH SECTION (Awal) -->
    <div id="auth-section">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="openAuthTab('login')">Login</button>
        <button class="tab-btn" onclick="openAuthTab('daftar')">Daftar</button>
      </div>

      <div id="auth-alert" class="alert"></div>

      <!-- TAB LOGIN -->
      <div id="tab-login" class="tab-content active">
        <form id="form-login" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-nickname">Nickname</label>
            <input type="text" id="login-nickname" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required>
          </div>
          <button type="submit" class="btn-submit">Masuk</button>
        </form>
      </div>

      <!-- TAB DAFTAR -->
      <div id="tab-daftar" class="tab-content">
        <form id="form-daftar" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="reg-nickname">Nickname</label>
            <input type="text" id="reg-nickname" required>
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" required>
          </div>
          <div class="form-group">
            <label for="reg-confirm-password">Konfirmasi Password</label>
            <input type="password" id="reg-confirm-password" required>
          </div>
          <button type="submit" class="btn-submit">Daftar Akun</button>
        </form>
      </div>
    </div>

    <!-- GAME DASHBOARD SECTION (Setelah Login) -->
    <div id="game-section" style="display: none;">
      <div class="game-header">
        <div class="player-info">
          <h3 id="player-name">Petani</h3>
        </div>
        <div class="gold-display">💰 <span id="player-koin">100</span> Koin</div>
      </div>

      <div class="nav-tabs">
        <button class="tab-btn active" onclick="openGameTab('menanam')">Menanam</button>
        <button class="tab-btn" onclick="openGameTab('pasar')">Pasar</button>
      </div>

      <!-- TAB MENANAM -->
      <div id="tab-menanam" class="tab-content active">
        <h4>Lahan Pertanian Saya</h4>
        <div class="farm-land" id="lahan-1">
          <p id="status-lahan">Lahan Kosong</p>
          <button id="btn-tanam" class="btn-submit" style="width: auto; margin-top: 10px; display: none;" onclick="tanamTanaman()">Tanam Bibit</button>
        </div>
      </div>

      <!-- TAB PASAR -->
      <div id="tab-pasar" class="tab-content">
        <h4>Toko Bibit</h4>
        <br>
        <div class="card-item">
          <div>
            <strong>🍉 Semangka</strong><br>
            <small>Harga: 40 Koin | Waktu: 24 Jam</small>
          </div>
          <button class="btn-buy" onclick="beliBibit('Semangka', 40)">Beli</button>
        </div>

        <div class="card-item">
          <div>
            <strong>🍈 Melon</strong><br>
            <small>Harga: 30 Koin | Waktu: 18 Jam</small>
          </div>
          <button class="btn-buy" onclick="beliBibit('Melon', 30)">Beli</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx.../exec';

    // UI Tab Navigation
    function openAuthTab(tabName) {
      document.querySelectorAll('#auth-section .tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('#auth-section .tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      event.currentTarget.classList.add('active');
      showAlert('', '');
    }

    function openGameTab(tabName) {
      document.querySelectorAll('#game-section .tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('#game-section .tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function showAlert(message, type) {
      const alertBox = document.getElementById('auth-alert');
      if (!message) {
        alertBox.style.display = 'none';
        return;
      }
      alertBox.className = 'alert alert-' + type;
      alertBox.innerText = message;
      alertBox.style.display = 'block';
    }

    // Auth Handlers
    async function handleRegister(e) {
      e.preventDefault();
      const nickname = document.getElementById('reg-nickname').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (password !== confirmPassword) {
        showAlert('Konfirmasi password tidak cocok! Silakan ulangi.', 'error');
        return;
      }

      showAlert('Mendaftarkan akun...', 'success');

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'register', nickname, password })
        });
        const result = await response.json();

        if (result.status === 'success') {
          showAlert('Pendaftaran berhasil! Silakan login.', 'success');
          document.getElementById('form-daftar').reset();
          openAuthTab('login');
        } else {
          showAlert(result.message || 'Pendaftaran gagal.', 'error');
        }
      } catch (err) {
        showAlert('Terjadi kesalahan koneksi ke database.', 'error');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const nickname = document.getElementById('login-nickname').value.trim();
      const password = document.getElementById('login-password').value;

      showAlert('Memeriksa akun...', 'success');

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', nickname, password })
        });
        const result = await response.json();

        if (result.status === 'success') {
          document.getElementById('auth-section').style.display = 'none';
          document.getElementById('game-section').style.display = 'block';
          document.getElementById('player-name').innerText = nickname;
        } else {
          showAlert(result.message || 'Nickname atau password salah!', 'error');
        }
      } catch (err) {
        showAlert('Terjadi kesalahan koneksi ke database.', 'error');
      }
    }

    // Game Logic Simple
    let koin = 100;

    function beliBibit(nama, harga) {
      if (koin >= harga) {
        koin -= harga;
        document.getElementById('player-koin').innerText = koin;
        alert(`Berhasil membeli bibit ${nama}! Pergi ke tab Menanam untuk menanamnya.`);
        document.getElementById('status-lahan').innerText = `Siap menanam ${nama}`;
        document.getElementById('btn-tanam').style.display = 'inline-block';
      } else {
        alert('Koin kamu tidak cukup!');
      }
    }

    function tanamTanaman() {
      document.getElementById('status-lahan').innerText = '🌱 Tanaman sedang tumbuh...';
      document.getElementById('btn-tanam').style.display = 'none';
    }
  </script>
</body>
</html>
