<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Bertani</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="game-header">
      <div class="player-info">
        <h3>👨‍🌾 Petani</h3>
      </div>
      <div class="gold-display">💰 Rp <span id="player-koin">2.500</span></div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="openGameTab('menanam')">Lahan</button>
      <button class="tab-btn" onclick="openGameTab('pasar')">Pasar</button>
      <button class="tab-btn" onclick="openGameTab('inventory')">Inventory</button>
    </div>

    <!-- TAB LAHAN -->
    <div id="tab-menanam" class="tab-content active">
      <h4>Lahan Pertanian Saya</h4>
      <div class="farm-land" id="lahan-1">
        <p id="status-lahan">Lahan Kosong</p>
        <button id="btn-tanam" class="btn-submit" style="width: auto; margin-top: 10px; display: none;" onclick="tanamTanaman()">Tanam Bibit</button>
        <button id="btn-panen" class="btn-submit" style="width: auto; margin-top: 10px; display: none; background-color: #f57f17;" onclick="panenTanaman()">Panen Hasil</button>
      </div>
    </div>

    <!-- TAB PASAR -->
    <div id="tab-pasar" class="tab-content">
      <h4>Toko Bibit</h4>
      <br>
      <div class="card-item">
        <div>
          <strong>🌱 Bibit Semangka</strong><br>
          <small>Harga: Rp 800 | Waktu: 24 Jam</small>
        </div>
        <button class="btn-buy" onclick="beliBibit('Bibit Semangka', 800)">Beli</button>
      </div>

      <div class="card-item">
        <div>
          <strong>🌱 Bibit Melon</strong><br>
          <small>Harga: Rp 500 | Waktu: 18 Jam</small>
        </div>
        <button class="btn-buy" onclick="beliBibit('Bibit Melon', 500)">Beli</button>
      </div>
    </div>

    <!-- TAB INVENTORY -->
    <div id="tab-inventory" class="tab-content">
      <h4>Inventory Saya</h4>
      <br>
      <div id="inventory-list">
        <p style="color: #777; font-style: italic;">Inventory masih kosong.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
